name: Release DMG

# Сборка устанавливаемого DMG. Запускается вручную или по тегу vX.Y.Z, чтобы не
# расходовать дорогие (×10) macOS-минуты на каждый push.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    name: Build installable DMG (macOS)
    # macos-15 несёт Xcode 16+, совместимый с форматом проекта, который генерирует XcodeGen.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPull-dmg
          path: dist/*.dmg
          if-no-files-found: error
