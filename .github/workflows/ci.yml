name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # Собирается и тестируется весь пакет. Чистая логика (PhotoPullCore) покрыта
      # модульными тестами; таргет PhotoPull (SwiftUI + ImageCaptureCore) собирается,
      # но реальные сценарии с устройством на CI не воспроизводятся.
      - name: Run tests
        run: swift test --enable-code-coverage
