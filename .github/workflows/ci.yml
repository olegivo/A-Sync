name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Тесты общей логики (KMP commonMain/commonTest) на JVM.
  # Linux-раннер тарифицируется ×1 — здесь покрывается основная масса кода.
  logic-tests:
    name: Shared logic tests (JVM, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run shared JVM tests
        run: ./gradlew :shared:jvmTest --console=plain

  # Сборка Apple-артефактов: XCFramework из KMP + компиляция macOS-приложения.
  # macOS-раннер тарифицируется ×10 — используется только для сборки, не для логики.
  macos-build:
    name: Build XCFramework & macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      - name: Assemble Shared XCFramework
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --console=plain

      - name: Build macOS app
        run: swift build
